  <rect x="64" y="244" width="170" height="1" fill="url(#accentFade)"/>

  <text x="64" y="286" fill="#d6ff57" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">SOFTWARE · SYSTEMS · AI · AUTOMATION</text>
  <text x="64" y="320" fill="#687176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">JAPAN · REMOTE / GLOBAL · marcelosofficial-ctrl.github.io/portfolio</text>

