      <stop offset="0" stop-color="#0b0d0e"/>
      <stop offset="1" stop-color="#111517"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6ff57" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d6ff57" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1120" cy="28" r="280" fill="#d6ff57" fill-opacity="0.035"/>
  <rect x="64" y="58" width="7" height="7" rx="3.5" fill="#d6ff57"/>
