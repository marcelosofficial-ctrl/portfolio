<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Marcelo Ellwanger — Software, Systems, AI, Automation</title>
  <desc id="desc">Dark editorial MARCELO/LAB banner with Marcelo Ellwanger's name, engineering focus and portfolio URL.</desc>
  <defs>
